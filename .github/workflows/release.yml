name: Release APK/AAB

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache debug keystore (keep sideload installs upgradeable)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Prepare keystore (if present in secrets)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Keystore configured from secrets."
          else
            echo "No keystore secrets: build signed with debug key (demo)."
          fi

      - name: Build release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      - name: Rename artifacts with version
        run: |
          VER="${{ github.ref_name }}"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$APK" ]; then mv "$APK" "app/build/outputs/apk/release/ninnananna-${VER}.apk"; fi
          if [ -f "$AAB" ]; then mv "$AAB" "app/build/outputs/bundle/release/ninnananna-${VER}.aab"; fi
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v6
        with:
          name: ninnananna-${{ github.ref_name }}-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload artifact (AAB)
        uses: actions/upload-artifact@v6
        with:
          name: ninnananna-${{ github.ref_name }}-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NinnaNanna ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}