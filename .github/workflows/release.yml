name: Release APK/AAB

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      - name: Prepara keystore (se presente nei secrets)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Keystore configurato dai secrets."
          else
            echo "Nessun secrets keystore: build firmata con chiave debug (demo)."
          fi

      - name: Build release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon --console=plain

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v6
        with:
          name: ninnananna-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload artifact (AAB)
        uses: actions/upload-artifact@v6
        with:
          name: ninnananna-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NinnaNanna ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}